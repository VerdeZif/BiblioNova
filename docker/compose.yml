services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: universidad-ldap-practica
    hostname: ldap.universidad.test

    environment:
      LDAP_ORGANISATION: "Universidad Tecnologica XYZ"
      LDAP_DOMAIN: "universidad.test"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:?Configura docker/.env}"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_VERIFY_CLIENT: "never"

    ports:
      - "127.0.0.1:1636:636"

    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - ./certs:/container/service/slapd/assets/certs:ro

    command: ["--copy-service"]

volumes:
  ldap_data:
  ldap_config:
